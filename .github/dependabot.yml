version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(rust)"
    cooldown:
      default-days: 1
    groups:
      config-disassembler:
        patterns:
          - "config-disassembler"
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          - "config-disassembler"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(github-actions)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(npm)"
    groups:
      dev-dependencies:
        dependency-type: "development"

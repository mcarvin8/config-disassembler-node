[package]
name = "config-disassembler-crate"
version = "0.4.0"
authors = ["Matt Carvin"]
license = "MIT"
edition = "2021"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "serde-json", "async"] }
napi-derive = "3"
config-disassembler = "0.11.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
env_logger = "0.11"
serde_json = "1"
log = "0.4"

# Linux glibc only: use mimalloc for the crate's (Rust) allocations. Inside a
# Node process -- V8, libuv and the napi tokio runtime each add threads -- glibc's
# per-thread malloc arenas held ~60 MB more RSS than the crate's own allocations
# needed on sf-decomposer's `large` recompose (sf-decomposer#653: ~230 MB native
# vs ~169 MB for the same work in a pure-Rust process). Other targets keep the
# system allocator: musl and the macOS/Windows allocators weren't measured, and
# limiting the C build keeps cross-compiled release targets low-risk.
# mimalloc-safe (napi-rs's fork, built for napi addons) rather than mimalloc:
# libmimalloc-sys passes -Wno-error=date-time on every non-Windows target, which
# the napi-rs cross toolchain's GCC rejects ("no option -Wdate-time"); release.yml
# builds BOTH linux-gnu targets with that toolchain (--use-napi-cross).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
mimalloc-safe = { version = "0.1", default-features = false }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
